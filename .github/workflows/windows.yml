name: Windows

# The Windows transport on a real Windows machine: Herdr's named pipe behind its marker file, the sb server's control pipe, and every module a
# session and the sidebar plugin load (tests/platform.test.ts). The rest of the suite drives Unix sockets and bash, and runs on Linux in the publish job.
on:
  push:
    branches: [main]
    paths: ["src/**", "herdr-plugin/**", "tests/platform.test.ts", "tests/lan-*.test.ts", "tests/win-acl.test.ts", "package.json", "package-lock.json", ".github/workflows/windows.yml"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: node --test tests/platform.test.ts
      # The LAN CA's writer, store, and network checks (an OpenSSL check skips on Windows when the runner has no openssl, and fails on Linux CI), and the listener: the first-byte split and `pauseOnConnect` on a Windows socket, and the firewall's rule-name quoting through PowerShell's own parser (tests/lan-firewall.test.ts).
      - run: node --import ./tests/setup.ts --test tests/lan-x509.test.ts tests/lan-ca.test.ts tests/lan-net.test.ts tests/lan-listener.test.ts tests/lan-firewall.test.ts

  # The state folder's ACL on real icacls and PowerShell, from an elevated token with UAC off (runneradmin, the U12 condition): explicit BA and AU grants are taken off, a deny ACE still refuses.
  win-acl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: node --import ./tests/setup.ts --test tests/win-acl.test.ts
